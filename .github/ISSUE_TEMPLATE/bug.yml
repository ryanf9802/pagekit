name: Bug
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands or page content that show the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pagekit version
      description: The output of `git rev-parse --short HEAD` in your clone.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - WSL
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: The output of `python --version`.
