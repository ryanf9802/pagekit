name: CI

on:
  pull_request:
    # ready_for_review runs the checks when a draft is marked ready, since drafts skip them.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked --group dev ruff check

  test:
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked --group dev --python ${{ matrix.python }} pytest -q

  # The one check that main requires, so changing the matrix needs no change to the ruleset.
  ci:
    if: always() && github.event.pull_request.draft != true
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.lint.result }}" = success && test "${{ needs.test.result }}" = success

  # Users update to releases, so a merge reaches them only once the merged commit has passed every check above.
  release:
    if: github.event_name == 'push'
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag and publish the next release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git tag --list 'v[0-9]*' --points-at "$GITHUB_SHA")" ]; then
            echo "This commit is already released."
            exit 0
          fi
          latest=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            # A run for an older commit can finish after a newer one: never release backwards.
            if git merge-base --is-ancestor "$GITHUB_SHA" "$latest"; then
              echo "$latest already includes this commit."
              exit 0
            fi
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          gh release create "$next" --target "$GITHUB_SHA" --title "$next" --generate-notes --latest
