<!-- A question the user answers. Names are keyed to the stable item ID. -->
<article class="pk-card" id="D-01">
  <div class="pk-card-head">
    <span class="pk-id">D-01</span>
    <h3>Short statement of the decision</h3>
  </div>
  <p>What is at stake, and the recommendation.</p>
  <fieldset class="pk-choices">
    <label><input type="radio" name="D-01.choice" value="option-a"> Option A (recommended)</label>
    <label><input type="radio" name="D-01.choice" value="option-b"> Option B</label>
  </fieldset>
  <div class="pk-field">
    <label for="D-01-notes">Notes</label>
    <textarea id="D-01-notes" name="D-01.notes"></textarea>
  </div>
</article>
