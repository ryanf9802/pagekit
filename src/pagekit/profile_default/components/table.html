<!-- Rows of comparable facts, with an ID column. -->
<!-- For many rows, prefer the compact table tag (docs/tags.md): one line per row, cells split by a pipe, first line
  the header. Keep this markup for cells that need attributes. -->
<div class="pk-table-wrap">
  <table>
    <thead><tr><th>ID</th><th>Column</th></tr></thead>
    <tbody><tr><td><span class="pk-id">T-01</span></td><td>Value</td></tr></tbody>
  </table>
</div>
