<!-- Table of contents built from the headings. -->
<!--
  max-level is the deepest heading to list: 2 for h2 only, 3 for h2 and h3 (the default), up to 6.
  title sets the heading above the list. title="" leaves it out.
  Headings with no id get one. Put data-pk-no-contents on a heading to leave it out of the list.
-->
<pk-contents max-level="3"></pk-contents>
