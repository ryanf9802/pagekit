<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pagekit</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="{{mark}}">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16181c">
<style>
{{theme}}
.pk-header .pk-logo { width: 30px; height: 30px; }
.pk-header .pk-wordmark { height: 20px; }
.ix-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.ix-controls input { flex: 1 1 220px; }
.ix-controls select { flex: 0 1 180px; }
.ix-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ix-item a { display: block; padding: 12px 16px; color: inherit; text-decoration: none; background: var(--pk-surface); border: 1px solid var(--pk-border); border-radius: var(--pk-radius); }
.ix-item a:hover { border-color: var(--pk-accent); }
.ix-item a:hover .ix-title { color: var(--pk-accent); }
.ix-title { font-weight: 600; overflow-wrap: anywhere; }
.ix-summary { color: var(--pk-muted); margin-top: 2px; overflow-wrap: anywhere; }
.ix-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; color: var(--pk-muted); font-size: 0.8125rem; }
</style>
</head>
<body>
<header class="pk-header"><div class="pk-bar">{{logo}}</div></header>
<main class="pk-main">
<h1>Your pages</h1>
<p class="pk-summary" id="count"></p>
<div class="ix-controls">
  <input id="q" type="search" placeholder="Search pages" aria-label="Search pages">
  <select id="profile" aria-label="Filter by profile"><option value="">All profiles</option></select>
</div>
<ul class="ix-list" id="list"></ul>
<p class="pk-summary" id="empty" hidden>No pages match.</p>
</main>
<script>
(function () {
  var pages = [];
  var list = document.getElementById("list");
  var q = document.getElementById("q");
  var profile = document.getElementById("profile");
  var empty = document.getElementById("empty");
  var count = document.getElementById("count");

  function date(value) {
    var d = typeof value === "number" ? new Date(value * 1000) : new Date(value);
    return String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0") + "/" + d.getFullYear();
  }

  function span(text, className) {
    var el = document.createElement("span");
    el.textContent = text;
    if (className) el.className = className;
    return el;
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    var shown = pages.filter(function (p) {
      if (profile.value && p.profile !== profile.value) return false;
      return !term || (p.title + " " + p.summary + " " + p.slug).toLowerCase().indexOf(term) !== -1;
    });
    list.replaceChildren.apply(list, shown.map(function (p) {
      var li = document.createElement("li");
      li.className = "ix-item";
      var a = document.createElement("a");
      a.href = p.url;
      var title = document.createElement("div");
      title.className = "ix-title";
      title.textContent = p.title;
      a.appendChild(title);
      if (p.summary) {
        var summary = document.createElement("div");
        summary.className = "ix-summary";
        summary.textContent = p.summary;
        a.appendChild(summary);
      }
      var meta = document.createElement("div");
      meta.className = "ix-meta";
      meta.appendChild(span(p.profile, "pk-badge"));
      meta.appendChild(span("Updated " + date(p.updated)));
      meta.appendChild(span(p.expires ? "Expires " + date(p.expires) : "Kept"));
      if (p.session) meta.appendChild(span("From " + p.session));
      a.appendChild(meta);
      li.appendChild(a);
      return li;
    }));
    empty.hidden = shown.length > 0;
    var noun = pages.length === 1 ? " page" : " pages";
    count.textContent = (shown.length === pages.length ? "" : shown.length + " of ") + pages.length + noun;
  }

  function load() {
    fetch("/api/pages").then(function (r) { return r.json(); }).then(function (data) {
      pages = data.sort(function (a, b) { return a.updated < b.updated ? 1 : -1; });
      var names = Array.from(new Set(pages.map(function (p) { return p.profile; }))).sort();
      var current = profile.value;
      profile.replaceChildren(profile.options[0]);
      names.forEach(function (name) {
        var option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        profile.appendChild(option);
      });
      profile.value = names.indexOf(current) === -1 ? "" : current;
      render();
    });
  }

  q.addEventListener("input", render);
  profile.addEventListener("change", render);
  window.addEventListener("focus", load);
  load();
})();
</script>
</body>
</html>
