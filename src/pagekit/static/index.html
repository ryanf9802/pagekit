<div class="ix-controls" data-pk-ignore>
  <input id="q" type="search" placeholder="Search pages" aria-label="Search pages">
  <select id="profile" aria-label="Filter by profile"><option value="">All profiles</option></select>
</div>
<ul class="ix-list" id="list"></ul>
<p class="pk-summary" id="empty" hidden>No pages match.</p>
<script>
(function () {
  var pages = [];
  var list = document.getElementById("list");
  var q = document.getElementById("q");
  var profile = document.getElementById("profile");
  var empty = document.getElementById("empty");
  var count = document.getElementById("count");

  function date(value) {
    var d = typeof value === "number" ? new Date(value * 1000) : new Date(value);
    return String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0") + "/" + d.getFullYear();
  }

  function span(text, className) {
    var el = document.createElement("span");
    el.textContent = text;
    if (className) el.className = className;
    return el;
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    var shown = pages.filter(function (p) {
      if (profile.value && p.profile !== profile.value) return false;
      return !term || (p.title + " " + p.summary + " " + p.slug).toLowerCase().indexOf(term) !== -1;
    });
    list.replaceChildren.apply(list, shown.map(function (p) {
      var li = document.createElement("li");
      li.className = "ix-item";
      var a = document.createElement("a");
      a.href = p.url;
      var title = document.createElement("div");
      title.className = "ix-title";
      title.textContent = p.title;
      a.appendChild(title);
      if (p.summary) {
        var summary = document.createElement("div");
        summary.className = "ix-summary";
        summary.textContent = p.summary;
        a.appendChild(summary);
      }
      var meta = document.createElement("div");
      meta.className = "ix-meta";
      meta.appendChild(span(p.profile, "pk-badge"));
      meta.appendChild(span("Updated " + date(p.updated)));
      meta.appendChild(span(p.expires ? "Expires " + date(p.expires) : "Kept"));
      if (p.session) meta.appendChild(span("From " + p.session));
      a.appendChild(meta);
      li.appendChild(a);
      return li;
    }));
    empty.hidden = shown.length > 0;
    var noun = pages.length === 1 ? " page" : " pages";
    count.textContent = (shown.length === pages.length ? "" : shown.length + " of ") + pages.length + noun;
  }

  function load() {
    fetch("/api/pages").then(function (r) { return r.json(); }).then(function (data) {
      pages = data.sort(function (a, b) { return a.updated < b.updated ? 1 : -1; });
      var names = Array.from(new Set(pages.map(function (p) { return p.profile; }))).sort();
      var current = profile.value;
      profile.replaceChildren(profile.options[0]);
      names.forEach(function (name) {
        var option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        profile.appendChild(option);
      });
      profile.value = names.indexOf(current) === -1 ? "" : current;
      render();
    });
  }

  q.addEventListener("input", render);
  profile.addEventListener("change", render);
  window.addEventListener("focus", load);
  load();
})();
</script>
