<div class="ix-controls" data-pk-ignore>
  <input id="q" type="search" placeholder="Search pages" aria-label="Search pages">
  <select id="profile" aria-label="Filter by profile"><option value="">All profiles</option></select>
</div>
<ul class="ix-list" id="list"></ul>
<p class="pk-summary" id="empty" hidden>No pages match.</p>
<script>
(function () {
  var pages = [];
  /* With one profile, naming it on every row says nothing. */
  var severalProfiles = false;
  var list = document.getElementById("list");
  var q = document.getElementById("q");
  var profile = document.getElementById("profile");
  var empty = document.getElementById("empty");
  var count = document.getElementById("count");

  function date(value) {
    var d = typeof value === "number" ? new Date(value * 1000) : new Date(value);
    return String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0") + "/" + d.getFullYear();
  }

  function cell(text, className, label) {
    var el = document.createElement("span");
    el.textContent = text;
    el.className = className;
    if (label) el.setAttribute("aria-label", label);
    return el;
  }

  /* Whole days until a page is deleted, counting any part of a day as one. */
  function daysLeft(expires) {
    return Math.ceil((expires * 1000 - Date.now()) / 86400000);
  }

  /* Saved pages never expire. Any other page says how long it has left, in amber when it is nearly gone. */
  function status(p) {
    if (p.pinned) return cell("Saved", "ix-status ix-saved");
    if (!p.expires) return cell("", "ix-status");
    var days = daysLeft(p.expires);
    var text = days <= 0 ? "today" : days === 1 ? "tomorrow" : "in " + days + " days";
    return cell(text, "ix-status" + (days <= 3 ? " ix-soon" : ""), "Expires " + text);
  }

  function row(p) {
    var li = document.createElement("li");
    li.className = "ix-item";
    var a = document.createElement("a");
    a.className = "ix-row";
    a.href = p.url;
    /* The details that do not get a column. */
    var details = [p.title];
    if (p.expires) details.push("Expires " + date(p.expires));
    if (p.session) details.push("From " + p.session);
    a.title = details.join("\n");
    a.appendChild(cell(p.title, "ix-title"));
    if (severalProfiles) a.appendChild(cell(p.profile, "ix-profile"));
    a.appendChild(cell(date(p.updated), "ix-updated", "Updated " + date(p.updated)));
    a.appendChild(status(p));
    li.appendChild(a);
    return li;
  }

  function header() {
    var li = document.createElement("li");
    li.className = "ix-head";
    li.setAttribute("aria-hidden", "true");
    li.appendChild(cell("Page", "ix-title"));
    if (severalProfiles) li.appendChild(cell("Profile", "ix-profile"));
    li.appendChild(cell("Updated", "ix-updated"));
    li.appendChild(cell("Expires", "ix-status"));
    return li;
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    var shown = pages.filter(function (p) {
      if (profile.value && p.profile !== profile.value) return false;
      return !term || (p.title + " " + p.slug).toLowerCase().indexOf(term) !== -1;
    });
    /* Saved pages come first, since they never expire out of this list. */
    var items = shown.filter(function (p) { return p.pinned; }).concat(shown.filter(function (p) { return !p.pinned; }));
    list.classList.toggle("ix-has-profile", severalProfiles);
    list.hidden = shown.length === 0;
    list.replaceChildren.apply(list, [header()].concat(items.map(row)));
    empty.hidden = shown.length > 0;
    var noun = pages.length === 1 ? " page" : " pages";
    count.textContent = (shown.length === pages.length ? "" : shown.length + " of ") + pages.length + noun;
  }

  function load() {
    fetch("/api/pages").then(function (r) { return r.json(); }).then(function (data) {
      pages = data.sort(function (a, b) { return a.updated < b.updated ? 1 : -1; });
      var names = Array.from(new Set(pages.map(function (p) { return p.profile; }))).sort();
      /* A saved copy sits under "saved", which is a place and not a profile. */
      severalProfiles = names.filter(function (name) { return name !== "saved"; }).length > 1;
      var current = profile.value;
      profile.replaceChildren(profile.options[0]);
      names.forEach(function (name) {
        var option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        profile.appendChild(option);
      });
      profile.value = names.indexOf(current) === -1 ? "" : current;
      render();
    });
  }

  q.addEventListener("input", render);
  profile.addEventListener("change", render);
  window.addEventListener("focus", load);
  load();
})();
</script>
