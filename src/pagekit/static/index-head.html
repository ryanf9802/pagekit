<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16181c">
<style>
.ix-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.ix-controls input { flex: 1 1 220px; }
.ix-controls select { flex: 0 1 180px; }
.ix-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.ix-group { grid-column: 1 / -1; margin-top: 4px; color: var(--pk-muted); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.ix-item a { display: block; height: 100%; overflow: hidden; color: inherit; text-decoration: none; background: var(--pk-surface); border: 1px solid var(--pk-border); border-radius: var(--pk-radius); }
.ix-item a:hover { border-color: var(--pk-accent); }
.ix-thumb { aspect-ratio: 2 / 1; background: var(--pk-surface-2); border-bottom: 1px solid var(--pk-border); }
.ix-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
.ix-body { padding: 8px 10px 10px; min-width: 0; }
.ix-item a:hover .ix-title { color: var(--pk-accent); }
.ix-title { font-size: 0.9375rem; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ix-summary { margin-top: 1px; color: var(--pk-muted); font-size: 0.8125rem; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ix-meta { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; margin-top: 5px; color: var(--pk-muted); font-size: 0.75rem; }

@media (max-width: 520px) {
  .ix-list { grid-template-columns: 1fr; gap: 8px; }
  .ix-item a { display: flex; }
  .ix-thumb { flex: none; width: 112px; aspect-ratio: auto; border-bottom: 0; border-right: 1px solid var(--pk-border); }
  .ix-body { flex: 1; align-self: center; }
}
</style>
