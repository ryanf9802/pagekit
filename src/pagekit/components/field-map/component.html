<table class="field-map">
  <thead>
    <tr><th>Source field</th><th>Destination</th><th>Transformation</th><th>Blank value</th></tr>
  </thead>
  <tbody>
    <tr><td><code>source_field</code></td><td>Destination field label</td><td>Copied as written</td><td>Left empty</td></tr>
  </tbody>
</table>
</div>
