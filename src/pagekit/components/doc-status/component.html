<!-- Document status: a key and value table. Present-tense facts only; dates as mm/dd/yyyy. -->
<h2 id="status">Document Status</h2>
<div class="pk-table-wrap">
<table class="doc-status">
  <tbody>
    <tr><th scope="row">Owner</th><td>Person or team</td></tr>
    <tr><th scope="row">Subject</th><td>What this document covers</td></tr>
    <tr><th scope="row">Last updated</th><td>mm/dd/yyyy</td></tr>
  </tbody>
</table>
</div>
