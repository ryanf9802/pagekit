[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pagekit"
version = "0.1.0"
description = "Profile-driven, self-contained HTML pages for coding agents: consistent branding, copy-back forms, automatic expiry."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pagekit = "pagekit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pagekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["posix: needs a POSIX shell script or symlink, so it is skipped on Windows"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pymupdf>=1.24",
    "pytest>=8",
    "ruff>=0.17.3",
]
